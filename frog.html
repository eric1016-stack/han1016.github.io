<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青蛙跳跳池塘 - 尋找公倍數</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background-color: #e0f2f1; /* 池塘水藍色 */
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            max-width: 700px;
            width: 100%;
            text-align: center;
        }
        h2 {
            color: #00695c;
            margin-top: 0;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f1f8e9;
            border-radius: 10px;
        }
        .frog-input {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-weight: bold;
        }
        .frog-input input {
            width: 60px;
            text-align: center;
            font-size: 18px;
            padding: 5px;
            border: 2px solid #ccc;
            border-radius: 5px;
        }
        .btn-jump {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn-jump:hover {
            background-color: #f57c00;
            transform: translateY(-2px);
        }
        .btn-jump:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .pad {
            aspect-ratio: 1;
            background-color: #c8e6c9; /* 荷葉預設顏色 */
            border-radius: 50%; /* 圓形荷葉 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
            position: relative;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .markers {
            display: flex;
            gap: 2px;
            margin-top: 2px;
            height: 14px;
        }
        .marker {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: none; /* 預設隱藏 */
        }
        .marker-a { background-color: #4caf50; box-shadow: 0 0 5px #4caf50;} /* 小綠蛙腳印 */
        .marker-b { background-color: #f44336; box-shadow: 0 0 5px #f44336;} /* 小紅蛙腳印 */
        
        /* 雙方重疊時的特效 */
        .pad.overlap {
            background-color: #fff59d;
            border: 3px solid #fbc02d;
            color: #f57f17;
            transform: scale(1.15);
            box-shadow: 0 0 15px rgba(251, 192, 45, 0.6);
            z-index: 2;
        }

        .results {
            text-align: left;
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #ff9800;
            font-size: 16px;
            line-height: 1.6;
        }
        .highlight {
            font-weight: bold;
            color: #d32f2f;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🐸 青蛙跳跳池塘 - 尋找公倍數</h2>
    <p>小綠蛙和小紅蛙準備跳過 40 片荷葉！牠們會在哪幾片荷葉上相遇呢？</p>
    
    <div class="controls">
        <div class="frog-input">
            <label style="color: #4caf50;">🟢 小綠蛙一次跳：</label>
            <input type="number" id="frogA" min="1" max="10" value="2">
        </div>
        <div class="frog-input">
            <label style="color: #f44336;">🔴 小紅蛙一次跳：</label>
            <input type="number" id="frogB" min="1" max="10" value="3">
        </div>
        <button class="btn-jump" id="jumpBtn" onclick="startJump()">開始跳躍！</button>
    </div>

    <div class="board" id="board">
        <!-- 荷葉會由 JS 生成 -->
    </div>

    <div class="results" id="results">
        等待青蛙起跳...<br><br><br>
    </div>
</div>

<script>
    const board = document.getElementById('board');
    const resultsDiv = document.getElementById('results');
    const jumpBtn = document.getElementById('jumpBtn');
    const TOTAL_PADS = 40; // 總共 40 片荷葉

    // 初始化荷葉
    function initBoard() {
        board.innerHTML = '';
        for (let i = 1; i <= TOTAL_PADS; i++) {
            const pad = document.createElement('div');
            pad.className = 'pad';
            pad.id = `pad-${i}`;
            
            const num = document.createElement('span');
            num.textContent = i;
            
            const markers = document.createElement('div');
            markers.className = 'markers';
            
            const markerA = document.createElement('div');
            markerA.className = 'marker marker-a';
            markerA.id = `markerA-${i}`;
            
            const markerB = document.createElement('div');
            markerB.className = 'marker marker-b';
            markerB.id = `markerB-${i}`;
            
            markers.appendChild(markerA);
            markers.appendChild(markerB);
            
            pad.appendChild(num);
            pad.appendChild(markers);
            board.appendChild(pad);
        }
    }

    function startJump() {
        const stepA = parseInt(document.getElementById('frogA').value);
        const stepB = parseInt(document.getElementById('frogB').value);
        
        if(stepA < 1 || stepB < 1) {
            alert("請輸入大於0的步數喔！");
            return;
        }

        // 鎖定按鈕，重置畫面
        jumpBtn.disabled = true;
        initBoard();
        resultsDiv.innerHTML = "青蛙正在努力跳躍中... 🐾";

        let currentPad = 1;
        let commonMultiples = [];

        // 使用 setInterval 製作動畫效果
        const jumpInterval = setInterval(() => {
            const pad = document.getElementById(`pad-${currentPad}`);
            const markerA = document.getElementById(`markerA-${currentPad}`);
            const markerB = document.getElementById(`markerB-${currentPad}`);
            
            let hasA = false;
            let hasB = false;

            // 判斷是否為 A 的倍數
            if (currentPad % stepA === 0) {
                markerA.style.display = 'block';
                hasA = true;
            }
            // 判斷是否為 B 的倍數
            if (currentPad % stepB === 0) {
                markerB.style.display = 'block';
                hasB = true;
            }

            // 判斷是否重疊 (公倍數)
            if (hasA && hasB) {
                pad.classList.add('overlap');
                commonMultiples.push(currentPad);
            }

            currentPad++;

            // 跳到底了，結束動畫並顯示結果
            if (currentPad > TOTAL_PADS) {
                clearInterval(jumpInterval);
                jumpBtn.disabled = false;
                showResults(stepA, stepB, commonMultiples);
            }
        }, 150); // 每 0.15 秒跳一格 (可以調整速度)
    }

    function showResults(stepA, stepB, common) {
        if (common.length === 0) {
            resultsDiv.innerHTML = `在 ${TOTAL_PADS} 片荷葉內，牠們沒有相遇 😢`;
            return;
        }

        const lcm = common[0]; // 第一個找到的公倍數就是最小公倍數
        
        let resultHtml = `
            🟢 小綠蛙 (每次跳 ${stepA} 格) 的倍數：${stepA}, ${stepA*2}, ${stepA*3}...<br>
            🔴 小紅蛙 (每次跳 ${stepB} 格) 的倍數：${stepB}, ${stepB*2}, ${stepB*3}...<br>
            ⭐ 牠們相遇的荷葉 (<strong>公倍數</strong>)：${common.join(', ')}...<br>
            👑 第一次相遇的荷葉 (<strong>最小公倍數</strong>)：<span class="highlight">${lcm}</span>
        `;
        resultsDiv.innerHTML = resultHtml;
    }

    // 網頁載入時先畫出空池塘
    initBoard();
</script>

</body>
</html>
